name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Cordova Project & Inject Custom Icon
      run: |
        cordova create myapp com.timely.app MrTimely
        cd myapp
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/myapp www/.git www/.github
        
        cordova platform add android
        
        # Automatically replace default launcher icons with thrag_square.png
        if [ -f "www/thrag_square.png" ]; then
          find platforms/android/app/src/main/res -name "ic_launcher*.png" | while read file; do
            cp www/thrag_square.png "$file"
          done
        fi
        
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MrTimely-APK
        path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
