name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Cordova Project from Web Assets
      run: |
        cordova create myapp com.timely.app MrTimely
        cd myapp
        # Copy all root repository files (except workflows and hidden folders) into www
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/myapp www/.git www/.github
        cordova platform add android
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MrTimely-APK
        path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
